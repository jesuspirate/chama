<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Chama — Non-custodial Bitcoin commerce for communities. Community trust, rendered in cryptography. 2-of-3 Shamir escrow, Nostr-native, Fedimint ecash." />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Chama — Bitcoin commerce for communities</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root {
        width: 100%; min-height: 100%;
        background: #0a0a0f;
        color: #e8e6e0;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      html, body { height: 100%; }
      body { overscroll-behavior: none; }
    </style>
    <!-- #50 theming: apply the persisted (or OS) light mode to the boot
         background BEFORE the bundle loads, so light users never get a dark
         flash. Dark stays the no-JS / first-run default. Keep the storage key
         + colors in sync with src/ui/theme.ts. -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("chama_theme_mode");
          var light = mode === "light" || (mode === "system" &&
            window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches);
          if (light) {
            // Appended <style> outranks the block above by order (no
            // !important — theme.ts's runtime inline styles must still win
            // if the user switches back to dark mid-session).
            var st = document.createElement("style");
            st.textContent = "html,body,#root{background:#f4f3ee;color:#1d1c24}";
            document.head.appendChild(st);
            document.documentElement.style.colorScheme = "light";
          }
        } catch (e) {}
      })();
    </script>
    <!-- The brand mark is visible in every first app surface. Fetch both
         presentation sizes before React boots instead of discovering them
         after the main bundle and wallet initialization. -->
    <link rel="preload" as="image" href="/icons/favicon-192x192.png" fetchpriority="high">
    <link rel="preload" as="image" href="/icons/chama-woven-trust-mark-transparent-64.png" fetchpriority="high">
    <link rel="preload" as="image" href="/icons/chama-color-cycle-boot-hd-v6.png" type="image/png" fetchpriority="high">
    <!-- Self-hosted webfonts: DM Sans + JetBrains Mono (theme.ts declares them
         but they were never loaded → system fallback). Vendored woff2 under
         /fonts so the app renders with its real type offline/native (Tauri),
         no Google Fonts CDN. Preload the primary weights to avoid a swap flash
         on first paint; the rest load via the stylesheet. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/dmsans-400-latin.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/dmsans-700-latin.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/jbmono-400-latin.woff2" crossorigin>
    <link rel="stylesheet" href="/fonts/fonts.css">
    <!-- Woven Trust mark favicon suite. -->
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/favicon-96x96.png?v=0.9.4">
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48x48.png?v=0.9.4">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png?v=0.9.4">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png?v=0.9.4">
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico?v=0.9.4">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/favicon-192x192.png?v=0.9.4">
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/favicon-512x512.png?v=0.9.4">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=5.2.1">
    <!-- Android/Chrome/PWA -->
    <link rel="manifest" href="/icons/site.webmanifest">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Chama">
    <!-- Open Graph -->
    <meta property="og:title" content="Chama — Bitcoin commerce for communities.">
    <meta property="og:description" content="Non-custodial. Nostr-native. 2-of-3 Shamir escrow. Community trust, rendered in cryptography.">
    <meta property="og:image" content="https://getchama.app/icons/getchama-social-exchange-v1.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://getchama.app">
    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Chama — Bitcoin commerce for communities.">
    <meta name="twitter:description" content="Non-custodial. Nostr-native. 2-of-3 Shamir escrow.">
    <meta name="twitter:image" content="https://getchama.app/icons/getchama-social-exchange-v1.png">
  </head>
  <body>
    <div id="root">
      <div id="chama-boot" role="status" aria-label="Chama is opening">
        <img class="chama-boot-motion" src="/icons/chama-color-cycle-boot-hd-v6.png" width="112" height="112" alt="">
        <img class="chama-boot-static" src="/icons/chama-woven-trust-mark-transparent-64.png" width="112" height="112" alt="">
      </div>
    </div>
    <style>
      #chama-boot {
        min-height: 100dvh;
        display: grid;
        place-items: center;
      }
      #chama-boot img {
        display: block;
        width: 112px;
        height: 112px;
        object-fit: contain;
        filter: drop-shadow(0 12px 28px rgba(247, 147, 26, .18));
      }
      .chama-boot-static { display: none !important; }
      @media (prefers-reduced-motion: reduce) {
        .chama-boot-motion { display: none !important; }
        .chama-boot-static { display: block !important; }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
