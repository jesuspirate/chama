# Per-release short user-facing notes shown in the Zapstore app card.
# `metadata_sources: - github` below pulls repo-level metadata
# (description, README, icon paths) but NOT GitHub release bodies, so
# Zapstore users would otherwise see "No release notes." for every
# release. This file is gitignored and (re)written by the release flow
# from --zapstore-notes-file; if none is provided, the script writes a
# placeholder pointing readers at the full GitHub release notes for
# the engineering audience.
release_notes: ./zapstore/release-notes.md

name: Chama
summary: Local money, Bitcoin rails — peer-to-peer commerce with community-backed escrow.
description: |
  **Trade with your community. Trust the math, not a middleman.**

  Chama is a Nostr-native client for peer-to-peer commerce: exchange sats and
  local money, pay community bills, run a storefront, or offer work without a
  central Chama account server, custodial marketplace operator, or proprietary
  social graph.

  A *chama* is an East African savings circle built on shared responsibility.
  Chama carries that idea into open digital commerce. You choose your country,
  currency, payment rails, counterparty, and community arbiter. Listings, chat,
  reputation, and verifiable trade state travel over Nostr rather than through
  a company-owned marketplace database.

  **Escrow belongs to the trade—not to Chama.** A funded ecash trade uses three
  Shamir shares and a 2-of-3 outcome across buyer, seller, and arbiter. Ordinary
  trades settle when the two parties agree. The arbiter acts only when they
  disagree or when an expired trade needs a protocol-defined healing vote. No
  single participant, arbiter, or Chama operator can move the sats alone.

  **Chama is not a wallet.** Fedimint ecash is held only while a trade is active.
  After settlement, claim promptly through the route that fits you: a Lightning
  address or invoice, a connected Nostr Wallet Connect wallet, ecash export,
  on-chain Bitcoin where available, or supported local cash-out rails such as
  M-Pesa in Kenya. Your Nostr key restores your identity and trade history; it
  does not recreate device-local bearer ecash.

  **Built for commerce, not speculation:**

  - Exchange Bitcoin and local currency using the payment methods people already use
  - Buy or sell goods through community storefronts
  - Find or offer work with the same verifiable escrow protocol
  - Coordinate community bill payments without a central collection account
  - Browse through a guided Chama assistant or open the full marketplace tools
  - Build portable reputation from completed, cryptographically verifiable trades

  **No Chama signup. No email. No KYC database.** Your Nostr identity is your
  account, and encrypted trade coordination can travel across multiple relays.
  Chama runs on the web, as an Android or desktop app, and as a self-hosted
  StartOS service. Wallet storage follows the client you use, so preserve your
  Nostr secret key and any exported bearer notes separately.

  Local money. Bitcoin rails. Bring your keys—and bring your circle.
