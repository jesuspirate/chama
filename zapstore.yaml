# Per-release short user-facing notes shown in the Zapstore app card.
# `metadata_sources: - github` below pulls repo-level metadata
# (description, README, icon paths) but NOT GitHub release bodies, so
# Zapstore users would otherwise see "No release notes." for every
# release. This file is gitignored and (re)written by the release flow
# from --zapstore-notes-file; if none is provided, the script writes a
# placeholder pointing readers at the full GitHub release notes for
# the engineering audience.
release_notes: ./zapstore/release-notes.md

name: Chama
summary: Trade Bitcoin and local money with people in your community.
description: |
  Chama helps you find people to trade Bitcoin and local money, pay bills,
  or buy and sell goods.

  Choose what you have, what you need, and your payment method. Find a
  matching offer, agree on the terms, and choose a community arbiter together.

  Bitcoin is held in escrow during the trade. Two of the three participants
  — buyer, seller, and arbiter — must agree to settle it. Chama cannot move
  the funds on its own.

  Sign in with a Nostr identity. No email required. Try the sandbox before
  using real sats.

  Keep your recovery key safe. It restores your identity, not ecash stored
  on your device. Claim your sats after settlement.
website: https://getchama.app
