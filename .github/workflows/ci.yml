name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest

    steps:
      # SECURITY: GitHub Actions are pinned to full commit SHAs rather
      # than floating tags. A mutable tag (@v6, @main) can be force-
      # repointed by the action's maintainer or by an attacker who
      # compromises the publishing account, silently injecting
      # build-time code execution into CI runs that have access to
      # repo secrets and the npm publish surface. SHA pins make every
      # action upgrade an explicit, reviewable diff.
      #
      # When bumping these, double-check the SHA against the GitHub
      # release page for the named version.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      # Denylist check (crypto-js / plain-crypto-js / axios must never
      # appear) + npm audit gate on production deps at high/critical.
      # Dev-only advisories are out of scope here; see scripts/dependency-audit.mjs.
      - name: Dependency security audit
        run: npm run audit:deps

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
