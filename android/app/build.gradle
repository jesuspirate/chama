apply plugin: 'com.android.application'

import groovy.json.JsonSlurper
import java.util.Properties

def appPackageJson = new JsonSlurper().parse(new File(rootDir.parentFile, "package.json"))
def appVersionName = appPackageJson.version as String
// X.Y.Z-rc.N → base*100 + N (N = 1..98); X.Y.Z → base*100 + 99, so an rc always sorts
// below its release and Zapstore offers the release to a phone running the rc.
// Same formula as scripts/android-version-code.mjs, which android-release.sh checks.
def appVersionMatch = appVersionName =~ /^(\d+)\.(\d+)\.(\d+)(?:-rc\.(\d+))?$/
if (!appVersionMatch.matches()) throw new GradleException("Unsupported Android version ${appVersionName}: expected X.Y.Z or X.Y.Z-rc.N")
def appVersionParts = (1..3).collect { appVersionMatch.group(it) as int }
if (appVersionParts[1] > 99 || appVersionParts[2] > 99) throw new GradleException("Unsupported Android version ${appVersionName}: minor and patch must be 0..99")
def appVersionBase = appVersionParts[0] * 10000 + appVersionParts[1] * 100 + appVersionParts[2]
def appVersionRc = appVersionMatch.group(4) == null ? null : (appVersionMatch.group(4) as int)
if (appVersionRc != null && (appVersionRc < 1 || appVersionRc > 98)) throw new GradleException("Unsupported Android version ${appVersionName}: rc must be 1..98")
def appVersionCode = appVersionRc == null ? appVersionBase * 100 + 99 : appVersionBase * 100 + appVersionRc
def appAbi = System.getenv("CHAMA_ANDROID_ABI") ?: "arm64-v8a"

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def signingValue = { propName, envName ->
    def fromFile = keystoreProperties.getProperty(propName)
    return fromFile ?: System.getenv(envName)
}

def releaseStoreFile = signingValue("storeFile", "CHAMA_ANDROID_STORE_FILE")
def releaseStorePassword = signingValue("storePassword", "CHAMA_ANDROID_STORE_PASSWORD")
def releaseKeyAlias = signingValue("keyAlias", "CHAMA_ANDROID_KEY_ALIAS")
def releaseKeyPassword = signingValue("keyPassword", "CHAMA_ANDROID_KEY_PASSWORD")
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
def fedimintBridgeJniDir = layout.buildDirectory.dir("generated/jniLibs/chamaFedimintBridge")
def buildFedimintBridgeForDebug = providers
        .environmentVariable("CHAMA_ANDROID_NATIVE_BRIDGE_DEBUG")
        .map { it == "1" || it.equalsIgnoreCase("true") || it.equalsIgnoreCase("yes") }
        .orElse(false)

android {
    namespace = "app.chama.market"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.chama.market"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters appAbi
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs += fedimintBridgeJniDir
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("Release signing not configured. Add android/keystore.properties or CHAMA_ANDROID_* env vars before publishing.")
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.register("buildFedimintBridgeAndroid", Exec) {
    workingDir rootDir.parentFile
    commandLine "./scripts/build-android-fedimint-bridge.sh",
            "--output-dir",
            fedimintBridgeJniDir.get().asFile.absolutePath
}

afterEvaluate {
    tasks.matching { task ->
        task.name == "mergeReleaseJniLibFolders" ||
                (buildFedimintBridgeForDebug.get() && task.name == "mergeDebugJniLibFolders")
    }.configureEach {
        dependsOn tasks.named("buildFedimintBridgeAndroid")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation "androidx.work:work-runtime:2.10.1"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "org.unifiedpush.android:connector:3.3.5"
    implementation platform("com.google.firebase:firebase-bom:34.3.0")
    implementation "com.google.firebase:firebase-messaging"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
