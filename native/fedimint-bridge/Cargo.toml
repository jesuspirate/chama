[package]
name = "chama-fedimint-bridge"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.98"
axum = "0.8.9"
clap = { version = "4.5.60", features = ["derive", "env"] }
fedimint-api-client = "=0.11.1"
fedimint-bip39 = "=0.11.1"
fedimint-client = "=0.11.1"
fedimint-connectors = "=0.11.1"
fedimint-core = "=0.11.1"
fedimint-ln-client = { version = "=0.11.1", features = ["cli"] }
fedimint-lnv2-client = { version = "=0.11.1", features = ["cli"] }
fedimint-meta-client = { version = "=0.11.1", features = ["cli"] }
fedimint-mint-client = { version = "=0.11.1", features = ["cli"] }
fedimint-mintv2-client = { version = "=0.11.1", features = ["cli"] }
fedimint-rocksdb = "=0.11.1"
fedimint-wallet-client = { version = "=0.11.1", features = ["cli"] }
fedimint-walletv2-client = { version = "=0.11.1", features = ["cli"] }
futures = "0.3.32"
lightning-invoice = "0.33.2"
rand = "0.8.5"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.149"
socket2 = { version = "0.5.10", features = ["all"] }
tokio = { version = "1.48.0", features = ["full", "tracing"] }
tower-http = { version = "0.6.11", features = ["cors"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
