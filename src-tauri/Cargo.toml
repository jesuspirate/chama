[package]
name = "chama"
# Crate version is decorative — the shipped bundle version comes from
# tauri.conf.json, which points at ../package.json (single source of truth,
# bumped by scripts/release.sh). Kept loosely in sync to avoid confusion.
version = "2.10.0"
description = "Chama desktop shell"
authors = ["Chama"]
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.9.4", features = [] }
tauri-plugin-shell = "2.3.2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
rand = "0.9"
